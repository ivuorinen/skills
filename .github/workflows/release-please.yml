# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Release Please

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write # create release commits, tags, and GitHub releases
      pull-requests: write # open and update the release PR
    outputs:
      # Consumed by sync-lockfile below to find the release PR's branch.
      pr: ${{ steps.release.outputs.pr }}
      prs_created: ${{ steps.release.outputs.prs_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # Prefer a PAT/App token so the release PR triggers CI (GITHUB_TOKEN
          # cannot — GitHub's recursion guard). Falls back to GITHUB_TOKEN when
          # RELEASE_PLEASE_TOKEN is unset; then run Validate via workflow_dispatch.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  sync-lockfile:
    name: Sync uv.lock on the release PR
    # release-please rewrites the five manifests listed in .release-please-config.json
    # but has no updater for uv.lock, which keeps its own copy of the project
    # version in the root `[[package]]` entry. 3.0.0 shipped with the lockfile
    # still declaring 2.0.0. Teaching release-please directly is not an option:
    # the root package sits at a sorted index that moves whenever a dependency
    # is added, and a `generic` annotation comment is stripped the next time
    # `uv lock` regenerates the file. So regenerate it here instead.
    #
    # `make lock-check` fails on that drift, so without this job every release
    # PR would arrive red.
    needs: release-please
    # The branch name is asserted, not assumed. This workflow triggers on
    # `push` to main rather than on a pull-request event, so no fork PR reaches
    # it — but the checkout ref below still comes from another job's output, and
    # this job holds `contents: write` plus a token that may be the PAT. Pinning
    # the ref to the shape release-please itself produces means a ref that is
    # anything else never gets checked out, rather than being trusted because of
    # where it came from.
    if: >-
      needs.release-please.outputs.prs_created == 'true' &&
      startsWith(fromJSON(needs.release-please.outputs.pr).headBranchName,
                 'release-please--branches--main--')
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the regenerated lockfile onto the release PR branch
    env:
      # Read once, through the environment rather than interpolated into a
      # command, so the value is data to every step that uses it.
      RELEASE_BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No `ref:`. This checks out the push event's own commit on main,
          # which is the trusted ref for a `push` workflow; the release branch is
          # fetched in the next step, after its name is checked. Passing a
          # branch name that came from another job's output straight into this
          # action's `ref:` is the shape CodeQL's untrusted-checkout query
          # matches, and the validation is easier to read where it is used.
          # The security delta is small — the same commit is checked out either
          # way — but the check is now in the job rather than in an expression.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # Credentials are persisted deliberately: this job's whole purpose is
          # to push one commit back to the release branch.
          persist-credentials: true

      - name: Check out the release branch
        # The `if:` above already gates the job on this prefix. Repeated here
        # because that expression decides whether the job runs, while this
        # decides what it operates on, and only this one fails loudly.
        run: |
          case "$RELEASE_BRANCH" in
            release-please--branches--main--*) ;;
            *)
              echo "refusing to check out unexpected branch: $RELEASE_BRANCH" >&2
              exit 1
              ;;
          esac
          git fetch --depth=1 origin "$RELEASE_BRANCH"
          git switch --force-create "$RELEASE_BRANCH" FETCH_HEAD

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Regenerate uv.lock for the bumped version
        run: uv lock

      - name: Commit the lockfile if it moved
        # No-op on the common path: uv.lock changes only when the version did.
        # `chore:` because the commit-lint gate rejects a non-conventional
        # subject, and because a lockfile touches no published surface.
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already matches the bumped version — nothing to push"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'chore: sync uv.lock to the release version'
          # Explicit refspec: the branch was created locally from FETCH_HEAD, so
          # it has no upstream and a bare `git push` would fail.
          git push origin "HEAD:$RELEASE_BRANCH"
