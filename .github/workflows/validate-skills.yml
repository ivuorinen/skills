# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Validate Skills

on:
  push:
    branches:
      - main
  pull_request:
    # No `edited`: this workflow carries the required Validate check, and a job
    # skipped by an `if:` reports as success to branch protection — so a title
    # edit could satisfy the gate for a failing commit. Title linting lives in
    # pr-title.yml, which owns the `edited` event. `reopened` keeps the required
    # check from going stale when a PR is reopened with no new commits.
    types: [opened, reopened, synchronize]
  # Manual trigger so Validate can be run on the release-please branch, which
  # GITHUB_TOKEN-authored PRs cannot auto-trigger (see release-please.yml).
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    name: Lint commit messages
    # The pre-commit `conventional-commit-msg` hook runs at the commit-msg stage,
    # which `pre-commit run --all-files` never executes — so without this job CI
    # validates only the PR title, and that is a complete gate only under
    # squash-merge. release-please silently ignores unparseable commits.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read # read-only: reads the PR commit range to lint subjects
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: the base..head range must be walkable
          persist-credentials: false

      - name: Validate commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # The regex is read out of .pre-commit-config.yaml at runtime rather than
        # copied, so this gate and the commit-msg hook cannot drift apart.
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys

          config = open(".pre-commit-config.yaml").read()
          m = re.search(
              r"id: conventional-commit-msg[\s\S]*?^\s*entry: '([^']+)'$", config, re.M
          )
          if not m:
              sys.exit("could not read conventional-commit-msg regex from .pre-commit-config.yaml")
          pattern = re.compile(m.group(1))

          subjects = subprocess.run(
              ["git", "log", "--format=%s", f"{os.environ['BASE_SHA']}..{os.environ['HEAD_SHA']}"],
              check=True, capture_output=True, text=True,
          ).stdout.splitlines()

          bad = [s for s in subjects if not pattern.search(s)]
          for s in bad:
              print(f"::error::non-conventional commit subject: {s}")
          print(f"checked {len(subjects)} commit(s), {len(bad)} invalid")
          sys.exit(1 if bad else 0)
          PY

      - name: Reject breaking markers on CI-only commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # `!` and a BREAKING CHANGE footer both make release-please cut a MAJOR
        # release. .claude/rules/commit-types.md: "A workflow-only or CI-only
        # dependency bump is never breaking: it touches no published surface, so
        # it carries no `!`." The conventional-commit check above accepts `!` as
        # valid syntax, so nothing caught it — two Renovate commits carrying `!`
        # on a one-line CI bump would have published a spurious major version.
        # Deliberately narrow: only commits whose ENTIRE diff is CI config are
        # rejected, so a genuinely breaking change anywhere else still passes.
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys

          CI_ONLY = lambda p: p.startswith(".github/") or p == ".pre-commit-config.yaml"

          def git(*args):
              return subprocess.run(
                  ["git", *args], check=True, capture_output=True, text=True
              ).stdout

          rng = f"{os.environ['BASE_SHA']}..{os.environ['HEAD_SHA']}"
          bad = []
          for sha in git("log", "--format=%H", rng).split():
              subject = git("log", "-1", "--format=%s", sha).strip()
              body = git("log", "-1", "--format=%b", sha)
              # Conventional Commits treats `BREAKING CHANGE` and `BREAKING-CHANGE`
              # as synonymous footer tokens and release-please honours both, so
              # matching only the space form would miss half the spellings.
              marked = bool(re.match(r"^[a-z]+(\([^)]*\))?!:", subject)) or re.search(
                  r"^BREAKING[ -]CHANGE:", body, re.M
              )
              if not marked:
                  continue
              files = [f for f in git("show", "--name-only", "--format=", sha).split("\n") if f]
              if files and all(CI_ONLY(f) for f in files):
                  bad.append((sha[:8], subject))

          for sha, subject in bad:
              print(
                  f"::error::{sha} marks a breaking change but its diff is CI-only "
                  f"(see .claude/rules/commit-types.md): {subject}"
              )
          sys.exit(1 if bad else 0)
          PY

  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read # read-only: only reads the checkout to validate it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run the repository gate
        # ONE invocation, deliberately: the Makefile is the single definition of
        # what "checked" means. Listing the targets as separate steps here bought
        # per-gate visibility in the Actions UI, but at the cost of a second copy
        # that drifts — a target added to `make check` was silently absent from
        # CI until someone noticed, and each duplicated tool pin was one more
        # place to keep in step.
        #
        # `make check` = validate + validate-evals + validate-rules +
        # version-sync + lock-check + audit-consistency + index-check + lint +
        # format-check + security + typecheck + test + pre-commit. Each target
        # names the failing gate in its own output, so a failure is still
        # identifiable from the log.
        #
        # tests/test_hooks.py asserts this job runs `make check` rather than
        # restating the targets, so the collapse cannot quietly be undone.
        run: make check
