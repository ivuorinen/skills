# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Validate Skills

on:
  push:
    branches:
      - main
  pull_request:
    # No `edited`: this workflow carries the required Validate check, and a job
    # skipped by an `if:` reports as success to branch protection — so a title
    # edit could satisfy the gate for a failing commit. Title linting lives in
    # pr-title.yml, which owns the `edited` event. `reopened` keeps the required
    # check from going stale when a PR is reopened with no new commits.
    types: [opened, reopened, synchronize]
  # Manual trigger so Validate can be run on the release-please branch, which
  # GITHUB_TOKEN-authored PRs cannot auto-trigger (see release-please.yml).
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Commit-subject linting lives in commit-lint.yml, not here. `Lint commit
  # messages` is a required check, and a job skipped by an `if:` reports as
  # success to branch protection — so an `if:`-gated job in THIS workflow, which
  # declares `workflow_dispatch`, could be turned green by dispatching it. Same
  # reason pr-title.yml is separate. Do not move either job back in.
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read # read-only: only reads the checkout to validate it
    env:
      # Install only what mise.lock records, verified against its checksums. A
      # tool or platform the lock does not cover fails the job rather than
      # resolving a version on the fly.
      MISE_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned tools
        # mise.toml pins uv, ruff, pyright, prek and opengrep; mise.lock carries
        # each one's URL and checksum. That replaces the hand-pinned opengrep
        # download this job used to run, so no setup step executes a shell body
        # and Renovate's mise manager can move the pins.
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.22

      - name: Run the repository gate
        # ONE invocation, deliberately: .mise/tasks/check is the single
        # definition of what "checked" means. Listing the gates as separate
        # steps here bought per-gate visibility in the Actions UI, but at the
        # cost of a second copy that drifts — a target added to `make check`
        # was silently absent from CI until someone noticed, and each
        # duplicated tool pin was one more place to keep in step.
        #
        # `mise tasks` prints the current task list; enumerating it here as
        # well would be a second copy to update. Each task prefixes its output
        # with its own name, so a failure is still identifiable from the log.
        #
        # tests/test_hooks.py asserts this job runs `mise run check` rather than
        # restating the gates, so the collapse cannot quietly be undone.
        #
        # Needs the runner's preinstalled node: the `agentlinter` task fetches
        # a pinned npm package through npx. No setup-node step, because the
        # package version is what needed pinning and it is pinned in the script.
        # GitHub Actions sets CI=true, so a runner without npx fails that task
        # rather than skipping it the way a local clone does.
        run: mise run check
