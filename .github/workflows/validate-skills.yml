# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Validate Skills

on:
  push:
    branches:
      - main
  pull_request:
    # No `edited`: this workflow carries the required Validate check, and a job
    # skipped by an `if:` reports as success to branch protection — so a title
    # edit could satisfy the gate for a failing commit. Title linting lives in
    # pr-title.yml, which owns the `edited` event. `reopened` keeps the required
    # check from going stale when a PR is reopened with no new commits.
    types: [opened, reopened, synchronize]
  # Manual trigger so Validate can be run on the release-please branch, which
  # GITHUB_TOKEN-authored PRs cannot auto-trigger (see release-please.yml).
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Commit-subject linting lives in commit-lint.yml, not here. `Lint commit
  # messages` is a required check, and a job skipped by an `if:` reports as
  # success to branch protection — so an `if:`-gated job in THIS workflow, which
  # declares `workflow_dispatch`, could be turned green by dispatching it. Same
  # reason pr-title.yml is separate. Do not move either job back in.
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read # read-only: only reads the checkout to validate it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install opengrep
        # Pinned by version and verified by digest — the same discipline
        # .claude/rules/github-actions-security.md applies to actions and
        # pre-commit revs, and for the same reason: this binary executes inside
        # the authoritative Validate job. There is no action to SHA-pin, so the
        # release asset is pinned by its own sha256 instead.
        #
        # A setup step, not a gate: `make check` stays the single definition of
        # what "checked" means. Its `opengrep` target fails rather than skips
        # when the binary is missing under CI, so a broken install here surfaces
        # as a failed gate instead of a silent pass.
        #
        # Deliberately not on Renovate. It cannot compute a release asset's
        # sha256, so it would raise the version and leave the digest behind —
        # a PR that fails this step on every release. Move both by hand:
        #   gh api repos/opengrep/opengrep/releases/latest \
        #     --jq '.assets[] | select(.name=="opengrep_manylinux_x86") | .digest'
        # Half an update cannot merge: the checksum check below fails loudly
        # rather than running an unverified binary.
        env:
          OPENGREP_VERSION: v1.27.1
          OPENGREP_SHA256: 58053da76672bbeb5b0a5441021c58338707052e10f81d777140ca879bd491ce
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/opengrep \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  /tmp/opengrep" | sha256sum -c -
          chmod +x /tmp/opengrep
          sudo mv /tmp/opengrep /usr/local/bin/opengrep
          opengrep --version

      - name: Run the repository gate
        # ONE invocation, deliberately: the Makefile is the single definition of
        # what "checked" means. Listing the targets as separate steps here bought
        # per-gate visibility in the Actions UI, but at the cost of a second copy
        # that drifts — a target added to `make check` was silently absent from
        # CI until someone noticed, and each duplicated tool pin was one more
        # place to keep in step.
        #
        # `make help` prints the current target list and the `Makefile` is
        # authoritative; enumerating it here as well gave two copies to update
        # and both drifted. Each target names the failing gate in its own
        # output, so a failure is still identifiable from the log.
        #
        # tests/test_hooks.py asserts this job runs `make check` rather than
        # restating the targets, so the collapse cannot quietly be undone.
        #
        # Needs the runner's preinstalled node: the `agentlinter` target fetches
        # a pinned npm package through npx. No setup-node step, because the
        # package version is what needed pinning and it is pinned in the script.
        # GitHub Actions sets CI=true, so a runner without npx fails that target
        # rather than skipping it the way a local clone does.
        run: make check
