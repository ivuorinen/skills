name: Build
on:
  pull_request:

permissions: {}

concurrency:
  group: build-${{ github.ref }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Show the title safely
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "building for $TITLE"
