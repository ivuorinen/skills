---
# Codacy configuration.
# https://docs.codacy.com/repositories-configure/codacy-configuration-file/
#
# SCOPE — read before adding to this file.
#
# This file can exclude paths, turn engines off, and set a handful of
# tool-specific options. It CANNOT disable an individual rule; that is a
# per-tool setting in the Codacy UI. Two of this repository's disagreements with
# Codacy are per-rule and are therefore NOT resolved here — see `bandit` below.
#
# Codacy reads this file from the DEFAULT BRANCH. Settings added by a pull
# request are considered for that pull request's analysis, but the default
# branch wins on conflicts, and a removal only takes effect once merged.
#
# Adding this file also DISABLES the "Ignored files" settings configured in the
# Codacy UI. Any path ignored there must be repeated under `exclude_paths`.

exclude_paths:
  # Generated by findings.py. Already marked linguist-generated in the store's
  # own .gitattributes so GitHub collapses it in review; analysing it produces
  # findings about finding records.
  - "docs/audit/**"
  # graphify's generated knowledge graph and its cache.
  - "graphify-out/**"
  # Vendored: redistributed under its upstream license, not authored here.
  # See .claude/rules/vendored-skills.md and NOTICE.
  - ".claude/skills/graphify/**"

engines:
  # Lizard reports all three shapes seen on this repository: "cyclomatic
  # complexity of N", "has N parameters", and "has N non-comment lines of code".
  # Ruff is switched OFF for this repository in the Codacy UI, so Codacy is not
  # cross-checking complexity by another route — Lizard is the only source.
  #
  # Complexity is already gated here by ruff's C901 at max-complexity = 10, set
  # in pyproject.toml [tool.ruff.lint.mccabe] with its rationale, enforced by
  # `make lint` in `make check` and in CI. It passes on every function Lizard
  # flags, so the two disagree on how to count rather than on what the code
  # does, and only ruff can fail the build.
  #
  # Re-enable this if ruff's C901 is ever removed — do not leave the repository
  # with no complexity gate at all.
  #
  # Test files are excluded for a separate reason: 100% statement AND branch
  # coverage is required (pyproject.toml [tool.coverage.report] fail_under =
  # 100), so length in tests/ is that gate working, not a smell.
  lizard:
    exclude_paths:
      - "skills/**"
      - "scripts/**"
      - "tests/**"

  # Kept alongside `lizard` because Codacy's own complexity metric is reported
  # under this name, and which of the two produced a given finding is not
  # visible from the check-run output. Harmless if unused.
  metric:
    exclude_paths:
      - "skills/**"
      - "scripts/**"
      - "tests/**"

# NOT configured here, deliberately.
#
# Bandit reports B603 ("subprocess call without a static string") on the four
# `subprocess.run` call sites in the PR fetchers. pyproject.toml [tool.bandit]
# skips B404, B603 and B607 with the reasoning recorded beside them: every call
# passes a list argv, `shell=True` appears nowhere in this repository, and the
# interpolated values are validated upstream against a DNS-label pattern and a
# per-platform path charset before they reach an argv.
#
# Excluding those paths from bandit here would waive EVERY bandit rule on the
# shipped tools, which is strictly worse than the targeted skip list already in
# pyproject.toml.
#
# "Use configuration file" for Bandit was already enabled in the Codacy UI and
# the findings persisted, because bandit auto-discovers NOTHING: it honours a
# config only when explicitly given `-c <file>` or `--ini .bandit`, and it was
# not being pointed at pyproject.toml. The `.bandit` file added at the repo root
# gives it the canonical filename to find; tests/test_bandit_config.py keeps the
# two in step.
