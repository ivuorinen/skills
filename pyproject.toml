[project]
name = "ivuorinen-skills"
version = "3.1.0"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
# ruff is a test dependency, not just a linter: tests/test_hooks.py exercises
# ruff-hook.py, which shells out to the real `ruff` binary.
# ruff is pinned to the same version the .pre-commit-config.yaml rev names, and
# the Makefile and scripts/hooks/ruff-hook.py pin it too, so none of the four
# call sites can disagree about what passes. test_hooks.py enforces the match.
# bandit is pinned to its .pre-commit-config.yaml rev for the same reason.
# pyyaml parses the workflows in tests/test_hooks.py. It was already importable
# as a transitive of another dev tool, and the guard that reads the Validate job
# was hand-parsing YAML with regexes instead — four separate bypasses came from
# that, the last being a bare `- run:` step silently absorbed into its
# predecessor. Declared rather than relied on incidentally, since a lockfile
# change could otherwise remove it and take the test's parser with it.
dev = [
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "ruff==0.16.5",
  "bandit==1.9.4",
  "pyyaml>=6.0,<7",
]

[tool.coverage.run]
# `source`, not `include`. With `include` coverage reports only files it actually
# traced, so a module no test imports is absent from the report rather than shown
# at 0% — post-bash-revalidate.py, a live PostToolUse hook, sat outside a
# "100.00%" report that way. `source` scans the trees, so an untested module is
# reported and fails the gate below.
# Each directory is listed separately: coverage's source scan only recurses into
# subdirectories that are packages, and none of these carry an __init__.py, so
# "scripts" alone silently omits scripts/hooks/ — which is exactly how the hook
# above stayed hidden. A new script directory needs a new entry here.
source = [
  "scripts",
  "scripts/hooks",
  "skills/nitpicker/scripts",
]
# Decisions, not just statements: without this a half-taken `if` counts as
# covered, and 24 branches were passing that way — three of them with a mutation
# the whole suite survived.
branch = true

[tool.coverage.report]
# Statements AND branches, over every module in `source` including the ones no
# test imports. A new uncovered line or an untaken branch is a build failure, so
# a change and the test that exercises it land together. Lowering this is a
# decision to accept untested code, not a fix for a red build — cover it, or
# scope it out of [tool.coverage.run] deliberately.
precision = 2
fail_under = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "RUF", "C901"]
ignore = ["SIM108"]

[tool.ruff.lint.mccabe]
# The ceiling for new code. Codacy already fails a PR on a newly complex
# function, but only after it is pushed and only with a metric that names no
# location; this fails it in `make check` instead.
#
# Functions that predate the gate carry an explicit `# noqa: C901` rather than
# being exempted by path, so a *new* complex function in an already-complex file
# is still caught. RUF100 (enabled above) rejects an unnecessary noqa, so a
# marker cannot outlive the complexity it excuses — the exemption list only
# shrinks.
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
# Scope: the code that ships to consumers (skills/*/scripts/) and the internal
# tooling that executes on a developer's machine (scripts/). tests/ is excluded
# because nearly every hit is B101 (assert_used) — asserts are the test
# mechanism, not a defect. The remainder are B404/B105/B108 on the subprocess
# calls and fixture constants that drive the tools under test. Excluding the
# directory rather than skipping B101 globally keeps B101 live for shipped code,
# which uses no bare asserts today.
#
# Deliberately not a count. The previous wording pinned an exact figure ("815 of
# its 816 hits"), which the suite outgrew within a few releases; a rationale
# nobody can reproduce is worse than none, since it invites the reader to
# conclude the exclusion is unjustified rather than merely stale. Re-measure
# with `bandit -q -r tests/ -f json` if the balance ever needs checking.
exclude_dirs = ["tests", ".venv", "graphify-out", "_extra"]

# Three checks are skipped as structurally inapplicable, not as noise to bury:
#
#   B404 (subprocess import)  — informational; every hook and the PR fetcher
#                               must shell out to a validator or to `gh`.
#   B603 (subprocess without  — fires on every subprocess.run([...]) call. That
#         shell=True)           IS the safe form. No `shell=True` exists anywhere
#                               in the repo, and every argv is a fixed list, so
#                               there is no shell for an argument to escape into.
#   B607 (partial exec path)  — dev tooling resolves `git`, `uv`, `ruff`, `gh`,
#                               and `python3` through PATH by design; absolute
#                               paths would not survive a different machine.
#
# Everything else stays on, including B105/B310, which are handled at the call
# site with a `# nosec` naming the specific check and the reason.
skips = ["B404", "B603", "B607"]

[tool.pyright]
# Use the same virtualenv uv manages (`uv sync --extra dev`), so pyright sees
# pytest and the rest of the dev deps.
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
# Shipped skill tools import sibling modules from their own scripts/ dir
# (e.g. `from findings import ...`); add those dirs so pyright resolves them.
extraPaths = ["skills/nitpicker/scripts"]
# Declared rather than inherited, so an editor's language server and the pinned
# CLI in `make check` resolve the same rules. Left unset, each side falls back to
# its own default and the editor can report problems CI never sees, or miss ones
# it does. The Makefile gates on errorCount alone; that floor only means the same
# thing on both sides if the mode producing the errors is fixed here.
typeCheckingMode = "standard"
pythonPlatform = "All"
include = ["scripts", "skills", "tests"]
exclude = ["**/__pycache__", "**/node_modules", ".venv", "graphify-out"]
